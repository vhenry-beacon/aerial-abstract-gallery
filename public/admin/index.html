<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Projects · Aerial Abstract</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/studio.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">Aerial Abstract · Projects</div>
      <div class="contact"><a href="/admin/orders/">Orders &amp; payments</a></div>
    </header>

    <section id="login" class="login hidden">
      <form id="loginForm">
        <h1>Projects</h1>
        <input class="field" id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
        <div class="err" id="loginErr"></div>
        <button class="btn" style="width:100%">Sign in</button>
      </form>
    </section>

    <section id="app" class="hidden">
      <div class="pj-head">
        <h1 class="pj-title">Projects</h1>
        <span class="st-muted st-small" id="worker"></span>
      </div>
      <div class="pj-tiles" id="tiles"></div>

      <dialog id="newDlg" class="pj-dlg">
        <form id="newForm" method="dialog">
          <h2>New project</h2>
          <label>Project name<input class="field" id="nName" required placeholder="e.g. Smith wedding, June 2027"></label>
          <label>Client<input class="field" id="nClient" placeholder="Client or organization name"></label>
          <label>Event date<input class="field" id="nDate" type="date"></label>
          <div class="err" id="newErr"></div>
          <div class="row"><button class="btn ghost" value="cancel" type="button" id="newCancel">Cancel</button><button class="btn" id="newGo" type="submit">Create project</button></div>
        </form>
      </dialog>
    </section>
  </div>
  <script src="/assets/projects.js"></script>
</body>
</html>
