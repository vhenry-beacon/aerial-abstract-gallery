[build]
  command = "npm run build"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/g/*"
  to = "/g/index.html"
  status = 200

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
